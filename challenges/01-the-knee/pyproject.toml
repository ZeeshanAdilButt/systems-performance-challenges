[project]
name = "knee"
version = "0.1.0"
description = "Latency against utilization: theory, simulation and a real server, side by side."
requires-python = ">=3.12"
dependencies = ["jiffy-metrics", "jiffy-load", "jiffy-queueing", "jiffy-service"]

[project.scripts]
knee = "knee.run:main"

[tool.uv.sources]
jiffy-metrics = { workspace = true }
jiffy-load = { workspace = true }
jiffy-queueing = { workspace = true }
jiffy-service = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knee"]

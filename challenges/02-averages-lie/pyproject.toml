[project]
name = "averages-lie"
version = "0.1.0"
description = "Microbursts a one-second average hides, and the p99 a closed-loop load tool never sees."
requires-python = ">=3.12"
dependencies = ["jiffy-metrics", "jiffy-load", "jiffy-queueing", "jiffy-service"]

[project.scripts]
averages-lie = "averages_lie.run:main"

[tool.uv.sources]
jiffy-metrics = { workspace = true }
jiffy-load = { workspace = true }
jiffy-queueing = { workspace = true }
jiffy-service = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["averages_lie"]

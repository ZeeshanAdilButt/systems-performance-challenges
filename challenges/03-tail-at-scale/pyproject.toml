[project]
name = "tail-at-scale"
version = "0.1.0"
description = "Fan-out turns a rare slow backend into a common slow request; hedging takes most of it back."
requires-python = ">=3.12"
dependencies = ["jiffy-metrics", "jiffy-load", "jiffy-queueing", "jiffy-service"]

[project.scripts]
tail-at-scale = "tail_at_scale.run:main"

[tool.uv.sources]
jiffy-metrics = { workspace = true }
jiffy-load = { workspace = true }
jiffy-queueing = { workspace = true }
jiffy-service = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tail_at_scale"]

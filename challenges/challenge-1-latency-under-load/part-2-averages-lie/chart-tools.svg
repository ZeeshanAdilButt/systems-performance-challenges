<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>Server frozen 20% of the time: slow requests each tool saw</title>
<text x="64" y="24" font-size="15" font-weight="600" fill="#888780">Server frozen 20% of the time: slow requests each tool saw</text>
<text x="14" y="160.0" font-size="12" fill="#888780" transform="rotate(-90 14 160.0)" text-anchor="middle">share of requests</text>
<line x1="64" x2="660" y1="264.0" y2="264.0" stroke="#88878055" stroke-width="1"/>
<text x="56" y="268.0" font-size="11" fill="#888780" text-anchor="end">0%</text>
<line x1="64" x2="660" y1="212.0" y2="212.0" stroke="#88878055" stroke-width="1"/>
<text x="56" y="216.0" font-size="11" fill="#888780" text-anchor="end">5%</text>
<line x1="64" x2="660" y1="160.0" y2="160.0" stroke="#88878055" stroke-width="1"/>
<text x="56" y="164.0" font-size="11" fill="#888780" text-anchor="end">10%</text>
<line x1="64" x2="660" y1="108.0" y2="108.0" stroke="#88878055" stroke-width="1"/>
<text x="56" y="112.0" font-size="11" fill="#888780" text-anchor="end">15%</text>
<line x1="64" x2="660" y1="56.0" y2="56.0" stroke="#88878055" stroke-width="1"/>
<text x="56" y="60.0" font-size="11" fill="#888780" text-anchor="end">20%</text>
<rect x="149.3" y="166.2" width="28.0" height="97.8" rx="3" fill="#2a78d6"><title>server&#x27;s own timer: 9.4%</title></rect>
<text x="163.3" y="161.2" font-size="11" fill="#888780" text-anchor="middle">9.4%</text>
<text x="163.3" y="282" font-size="12" fill="#888780" text-anchor="middle">server&#x27;s own timer</text>
<rect x="348.0" y="241.1" width="28.0" height="22.9" rx="3" fill="#2a78d6"><title>wait-for-answer tool: 2.2%</title></rect>
<text x="362.0" y="236.1" font-size="11" fill="#888780" text-anchor="middle">2.2%</text>
<text x="362.0" y="282" font-size="12" fill="#888780" text-anchor="middle">wait-for-answer tool</text>
<rect x="546.7" y="79.9" width="28.0" height="184.1" rx="3" fill="#2a78d6"><title>send-on-schedule tool: 18%</title></rect>
<text x="560.7" y="74.9" font-size="11" fill="#888780" text-anchor="middle">18%</text>
<text x="560.7" y="282" font-size="12" fill="#888780" text-anchor="middle">send-on-schedule tool</text>
<line x1="535.6" x2="549.6" y1="20" y2="20" stroke="#2a78d6" stroke-width="3"/>
<text x="553.6" y="24" font-size="12" fill="#888780">slow (&gt; 50 ms)</text>
</svg>

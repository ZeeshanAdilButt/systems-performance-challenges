<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>Four ways to hedge while normal calls get slower</title>
<text x="64" y="24" font-size="15" font-weight="600" fill="#888780">Four ways to hedge while normal calls get slower</text>
<text x="14" y="160.0" font-size="12" fill="#888780" transform="rotate(-90 14 160.0)" text-anchor="middle">share</text>
<line x1="64" x2="660" y1="264.0" y2="264.0" stroke="#88878055" stroke-width="1"/>
<text x="56" y="268.0" font-size="11" fill="#888780" text-anchor="end">0%</text>
<line x1="64" x2="660" y1="212.0" y2="212.0" stroke="#88878055" stroke-width="1"/>
<text x="56" y="216.0" font-size="11" fill="#888780" text-anchor="end">25%</text>
<line x1="64" x2="660" y1="160.0" y2="160.0" stroke="#88878055" stroke-width="1"/>
<text x="56" y="164.0" font-size="11" fill="#888780" text-anchor="end">50%</text>
<line x1="64" x2="660" y1="108.0" y2="108.0" stroke="#88878055" stroke-width="1"/>
<text x="56" y="112.0" font-size="11" fill="#888780" text-anchor="end">75%</text>
<line x1="64" x2="660" y1="56.0" y2="56.0" stroke="#88878055" stroke-width="1"/>
<text x="56" y="60.0" font-size="11" fill="#888780" text-anchor="end">100%</text>
<rect x="108.5" y="180.8" width="28.0" height="83.2" rx="3" fill="#2a78d6"><title>no hedging: 40%</title></rect>
<text x="122.5" y="175.8" font-size="11" fill="#888780" text-anchor="middle">40%</text>
<rect x="140.5" y="264.0" width="28.0" height="0.0" rx="3" fill="#eb6834"><title>no hedging: 0%</title></rect>
<text x="154.5" y="259.0" font-size="11" fill="#888780" text-anchor="middle">0%</text>
<text x="138.5" y="282" font-size="12" fill="#888780" text-anchor="middle">no hedging</text>
<rect x="257.5" y="264.0" width="28.0" height="0.0" rx="3" fill="#2a78d6"><title>fixed 10 ms: 0%</title></rect>
<text x="271.5" y="259.0" font-size="11" fill="#888780" text-anchor="middle">0%</text>
<rect x="289.5" y="143.4" width="28.0" height="120.6" rx="3" fill="#eb6834"><title>fixed 10 ms: 58%</title></rect>
<text x="303.5" y="138.4" font-size="11" fill="#888780" text-anchor="middle">58%</text>
<text x="287.5" y="282" font-size="12" fill="#888780" text-anchor="middle">fixed 10 ms</text>
<rect x="406.5" y="263.3" width="28.0" height="0.7" rx="3" fill="#2a78d6"><title>adaptive p95: 0.3%</title></rect>
<text x="420.5" y="258.3" font-size="11" fill="#888780" text-anchor="middle">0.3%</text>
<rect x="438.5" y="249.6" width="28.0" height="14.4" rx="3" fill="#eb6834"><title>adaptive p95: 6.9%</title></rect>
<text x="452.5" y="244.6" font-size="11" fill="#888780" text-anchor="middle">6.9%</text>
<text x="436.5" y="282" font-size="12" fill="#888780" text-anchor="middle">adaptive p95</text>
<rect x="555.5" y="252.6" width="28.0" height="11.4" rx="3" fill="#2a78d6"><title>adaptive + budget: 5.5%</title></rect>
<text x="569.5" y="247.6" font-size="11" fill="#888780" text-anchor="middle">5.5%</text>
<rect x="587.5" y="258.4" width="28.0" height="5.6" rx="3" fill="#eb6834"><title>adaptive + budget: 2.7%</title></rect>
<text x="601.5" y="253.4" font-size="11" fill="#888780" text-anchor="middle">2.7%</text>
<text x="585.5" y="282" font-size="12" fill="#888780" text-anchor="middle">adaptive + budget</text>
<line x1="555.4" x2="569.4" y1="20" y2="20" stroke="#eb6834" stroke-width="3"/>
<text x="573.4" y="24" font-size="12" fill="#888780">extra calls</text>
<line x1="457.4" x2="471.4" y1="20" y2="20" stroke="#2a78d6" stroke-width="3"/>
<text x="475.4" y="24" font-size="12" fill="#888780">slow pages</text>
</svg>

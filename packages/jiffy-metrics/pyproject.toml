[project]
name = "jiffy-metrics"
version = "0.1.0"
description = "Latency histograms, and utilization and saturation of a resource from exact transitions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Zeeshan Adil", email = "zeeabutt@outlook.com" }]
keywords = ["latency", "percentiles", "histogram", "utilization", "use-method"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Topic :: System :: Benchmark",
]
dependencies = []

[project.urls]
Monorepo = "https://github.com/ZeeshanAdilButt/systems-performance-challenges"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jiffy_metrics"]

[project]
name = "jiffy-service"
version = "0.1.0"
description = "A tiny TCP service with a fixed worker pool, stop-the-world stalls and its own USE metrics."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Zeeshan Adil", email = "zeeabutt@outlook.com" }]
keywords = ["tcp", "worker-pool", "performance", "lab"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Topic :: System :: Benchmark",
]
dependencies = ["jiffy-metrics", "jiffy-load"]

[project.scripts]
jiffy-service = "jiffy_service.__main__:main"

[tool.uv.sources]
jiffy-metrics = { workspace = true }
jiffy-load = { workspace = true }

[project.urls]
Monorepo = "https://github.com/ZeeshanAdilButt/systems-performance-challenges"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jiffy_service"]

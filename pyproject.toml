[project]
name = "systems-performance-challenges"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jiffy-metrics",
    "jiffy-load",
    "jiffy-queueing",
    "jiffy-service",
    "jiffy-ui",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "hypothesis==6.168.5",
    "mypy==2.4.0",
    "ruff==0.17.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["toolkit/jiffy-*"]

[tool.uv.sources]
jiffy-metrics = { workspace = true }
jiffy-load = { workspace = true }
jiffy-queueing = { workspace = true }
jiffy-service = { workspace = true }
jiffy-ui = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N", "C4", "PIE", "RET"]

[tool.ruff.lint.isort]
known-first-party = [
    "jiffy_metrics", "jiffy_load", "jiffy_queueing", "jiffy_service", "jiffy_ui",
    "knee", "averages_lie", "tail_at_scale", "adaptive_hedging",
]

[tool.mypy]
strict = true
python_version = "3.12"
explicit_package_bases = true
cache_dir = ".cache/mypy"
mypy_path = "challenges/challenge-1-latency-under-load/part-1-the-knee,challenges/challenge-1-latency-under-load/part-2-averages-lie,challenges/challenge-1-latency-under-load/part-3-tail-at-scale,challenges/challenge-1-latency-under-load/part-4-adaptive-hedging"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
cache_dir = ".cache/pytest"
# Each part of a challenge is a folder with one script in it, not a package: put the
# folders on the path so a part's test can import its script.
pythonpath = [
    "challenges/challenge-1-latency-under-load/part-1-the-knee",
    "challenges/challenge-1-latency-under-load/part-2-averages-lie",
    "challenges/challenge-1-latency-under-load/part-3-tail-at-scale",
    "challenges/challenge-1-latency-under-load/part-4-adaptive-hedging",
]
norecursedirs = [".*", "*.egg", "build", "dist", "venv"]
markers = [
    "slow: starts a real server process and measures it for a few seconds",
]

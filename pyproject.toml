[project]
name = "systems-performance-challenges"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jiffy-metrics",
    "jiffy-load",
    "jiffy-queueing",
    "jiffy-service",
    "knee",
    "averages-lie",
    "tail-at-scale",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "hypothesis==6.168.5",
    "mypy==2.4.0",
    "ruff==0.17.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "challenges/*"]

[tool.uv.sources]
jiffy-metrics = { workspace = true }
jiffy-load = { workspace = true }
jiffy-queueing = { workspace = true }
jiffy-service = { workspace = true }
knee = { workspace = true }
averages-lie = { workspace = true }
tail-at-scale = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N", "C4", "PIE", "RET"]

[tool.ruff.lint.isort]
known-first-party = [
    "jiffy_metrics", "jiffy_load", "jiffy_queueing", "jiffy_service",
    "knee", "averages_lie", "tail_at_scale",
]

[tool.mypy]
strict = true
python_version = "3.12"
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
norecursedirs = [".*", "*.egg", "build", "dist", "venv"]
markers = [
    "slow: starts a real server process and measures it for a few seconds",
]

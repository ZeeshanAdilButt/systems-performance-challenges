[project]
name = "jiffy-load"
version = "0.1.0"
description = "Open- and closed-loop load generation that records latency from when a request should have been sent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Zeeshan Adil", email = "zeeabutt@outlook.com" }]
keywords = ["load-testing", "benchmark", "coordinated-omission", "latency"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Topic :: System :: Benchmark",
]
dependencies = []

[project.urls]
Monorepo = "https://github.com/ZeeshanAdilButt/systems-performance-challenges"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jiffy_load"]

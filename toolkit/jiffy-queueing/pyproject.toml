[project]
name = "jiffy-queueing"
version = "0.1.0"
description = "M/M/c queueing formulas and a FCFS multi-server simulator, to predict latency before measuring it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Zeeshan Adil", email = "zeeabutt@outlook.com" }]
keywords = ["queueing-theory", "erlang-c", "capacity-planning", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Topic :: System :: Benchmark",
]
dependencies = []

[project.urls]
Monorepo = "https://github.com/ZeeshanAdilButt/systems-performance-challenges"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jiffy_queueing"]
